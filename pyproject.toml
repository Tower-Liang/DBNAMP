[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dbnamp-repro"
version = "1.0.0"
description = "Portable reproducibility workflow for DBNAMP molecular processing"
requires-python = ">=3.10"
dependencies = [
  "biopython>=1.81",
  "numpy>=1.24",
  "pandas>=2.0",
  "rdkit>=2024.03.2",
  "torch>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.9",
  "tqdm>=4.65",
]

[tool.setuptools.packages.find]
where = ["."]
