[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dbnamp-repro"
version = "1.0.0"
description = "Portable reproducibility workflow for DBNAMP molecular processing"
requires-python = ">=3.9"
dependencies = ["biopython>=1.81", "numpy>=1.24", "pandas>=2.0", "rdkit>=2024.03.2"]

[tool.setuptools.packages.find]
where = ["."]
